# ============================================================
# docker-compose.yml — PostgreSQL for Quipu Backend
# Development environment database
# ============================================================

version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: quipu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: quipu_user
      POSTGRES_PASSWORD: quipu_appAdmin123
      POSTGRES_DB: quipu_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quipu_user -d quipu_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
